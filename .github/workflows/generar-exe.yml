name: Generar Instalador .EXE de MotoGestion FX

on:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Descargar Codigo
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: 4. Compilar Aplicacion Web
        run: npm run build

      - name: 5. Preparar Paquete de Escritorio
        shell: bash
        run: |
          mkdir -p build-desktop
          cp -r dist build-desktop/
          cat << 'EOF' > build-desktop/package.json
          {
            "name": "motogestion-fx",
            "version": "1.0.0",
            "description": "Sistema de Taller MotoGestion FX",
            "author": "Karen Salinas",
            "main": "main.js",
            "devDependencies": {
              "electron": "^29.0.0"
            }
          }
          EOF
          cat << 'EOF' > build-desktop/main.js
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({
              width: 1400,
              height: 900,
              title: 'MotoGestión FX - Sistema de Taller',
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            win.loadFile(path.join(__dirname, 'dist/index.html'));
            win.setMenuBarVisibility(false);
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF

      - name: 6. Instalar Electron y Builder
        shell: bash
        run: |
          cd build-desktop
          npm install --legacy-peer-deps
          npm install -D electron-builder --legacy-peer-deps

      - name: 7. Empaquetar Instalador .EXE para Windows
        shell: bash
        run: |
          cd build-desktop
          npx electron-builder --win nsis --config.productName="MotoGestion-FX" --config.directories.output=../dist-final

      - name: 8. Subir Instalador .EXE
        uses: actions/upload-artifact@v4
        with:
          name: MotoGestion-Setup-Windows-EXE
          path: dist-final/*.exe
