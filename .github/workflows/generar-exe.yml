name: Generar Instalador .EXE de MotoGestion FX

on:
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: 1. Descargar Codigo
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Dependencias
        run: npm install --legacy-peer-deps

      - name: 4. Instalar Electron y Builder
        run: npm install -D electron electron-builder --legacy-peer-deps

      - name: 5. Compilar Aplicacion Web
        run: npm run build

      - name: 6. Empaquetar Instalador .EXE para Windows
        run: npx electron-builder --win --config.directories.output=dist-installer --config.win.target=nsis --config.productName="MotoGestion-FX" --config.asar=false --config.extraFiles="dist/**" --config.files="index.js" --config.files="dist/**"

      - name: 7. Subir Instalador .EXE
        uses: actions/upload-artifact@v4
        with:
          name: MotoGestion-Setup-Windows-EXE
          path: dist-installer/*.exe
